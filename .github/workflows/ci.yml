name: RPH V4 CI

on:
  push:
    branches:
      - main
      - develop
      - 'import/**'
      - 'release/**'
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  v4-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile V4 entry points
        run: python -m py_compile rph_core/v4_orchestrator.py rph_core/steps/stage_calculator.py

      - name: Check absolute imports
        run: python scripts/ci/check_imports.py rph_core

      - name: Run V4 contract tests
        run: >-
          pytest -q
          tests/test_v4_protocol_contract.py
          tests/test_v4_checkpoint.py
          tests/test_v4_stage_calculator.py
          tests/test_v4_ui.py
