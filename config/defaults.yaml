# ReactionProfileHunter V4.0 canonical configuration
# Only S0-S4 settings are allowed here. Legacy V3 protocol branches are removed.

schema_version: rph_v4_config_v1

executables:
  # Optional compatibility backend. The supported V4 S0-S4 runtime does not
  # invoke Gaussian; S4 optimization, frequency and SP jobs all use ORCA.
  gaussian:
    path: /opt/software/gaussian/g16/g16
    root: /opt/software/gaussian/g16
    scratch_dir: /tmp/g16scratch
    use_wrapper: false
    wrapper_path: ""
  orca:
    # Active ORCA install (6.1.1). ORCA 6 forbids launching the main driver
    # with mpirun; %pal nprocs N end in the input is injected by ORCAInterface.
    path: /opt/orca_6_1_1/orca
    ld_library_path: /opt/orca_6_1_1
    mpi_bin_dir: /opt/openmpi418/bin
    mpi_lib_dir: /opt/openmpi418/lib
    # Active version; `versions` keeps the previous install switchable.
    version: "6.1.1"
    versions:
      "5.0.4":
        path: /opt/software/orca/orca
        ld_library_path: /opt/software/orca
        mpi_bin_dir: /opt/openmpi418/bin
        mpi_lib_dir: /opt/openmpi418/lib
      "6.1.1":
        path: /opt/orca_6_1_1/orca
        ld_library_path: /opt/orca_6_1_1
        mpi_bin_dir: /opt/openmpi418/bin
        mpi_lib_dir: /opt/openmpi418/lib
  crest:
    path: /opt/software/crest/crest
  xtb:
    path: /opt/software/xtb/bin/xtb
    fallback_paths:
      - /opt/xtb/bin/xtb
      - /usr/local/bin/xtb
  discovery:
    enabled: true
    fail_on_invalid_explicit: true

resources:
  mem: 32GB
  nproc: 16
  orca_maxcore_safety: 0.65
  # ORCA uses %pal for rank parallelism. Keep inherited BLAS/OpenMP libraries
  # serial inside each rank so the S1 scheduler's core accounting remains true.
  orca_math_threads_per_rank: 1

thermo:
  temperature_k: 298.15
  pressure_atm: 1.0

theory:
  s3_low_level:
    optimization:
      engine: orca
      task: opt
      method: B97-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      solvent_model: CPCM
      route_minimum: "Opt"
      route_ts: "OptTS"
      # The S3 TS tail is limited by the maximum displacement criterion.  Keep
      # OptTS steps conservative without changing the minimum or S4 workflows.
      ts_trust_radius: 0.15
      route_extras: ""
      # Global 60-cycle cap (S3 standardization 2026-08): converging points
      # finish well inside (measured 3-17 cycles); the cap bounds failure time.
      # Non-converged TS/INT enter the rescue matrix instead of a long tail.
      max_cycles: 60
      max_cycles_intermediate: 60
      max_cycles_ts: 60
      timeout: 864000
      # Sequential B97-3c conditioning on the target PES. Only S2-derived
      # intermediate/TS seeds are restrained; final OPT/OptTS is unrestrained.
      warmup:
        enabled: true
        roles:
          - intermediate
          - ts
        # LooseOpt applies only to the constrained warm-up; the final Opt/OptTS
        # remains unconstrained and retains the standard convergence policy.
        # Cycles extended to the LooseOpt convergence limit (native early exit).
        convergence: loose
        max_cycles:
          intermediate: 40
          ts: 50
        accept_partial_geometry: true
      # V4.1: retry/rank-reduction machinery removed. A failed OPT/OptTS now
      # hard-fails the structure (status="failed", SP/FREQ skipped). Improving
      # the S2 TS guess is the preferred way to improve convergence.
      frequency:
        enabled_for_minima: true
        enabled_for_ts: true
        task: freq
        imaginary_cutoff_cm1: -50.0
        require_exactly_one: true
        soft_mode_window_cm1: [-50.0, -10.0]
        soft_mode_review:
          enabled: true
          perturbation_scale_bohr: 0.1
          projection_threshold: 0.3
          max_perturbation_attempts: 2
    single_point:
      engine: orca
      task: sp
      method: r2SCAN-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      solvent_model: CPCM
      # Meta-GGA (r2SCAN family) requires an enhanced numerical integration
      # grid; DEFGRID2 (6.x default) can be too sparse for accurate SPs.
      grid: DefGrid3
      timeout: 864000

  s4_high_precision:
    optimization:
      engine: orca
      task: opt
      method: M062X
      basis: def2-SVP
      aux_basis: def2/J
      solvent: acetone
      solvent_model: CPCM
      route_minimum: "Opt"
      route_ts: "OptTS"
      route_extras: ""
      grid: DefGrid3
      scf: TightSCF
      max_cycles: 200
      timeout: 864000
      # V4.1: retry/rank-reduction machinery removed (see s3_low_level note).
      frequency:
        enabled_for_minima: true
        enabled_for_ts: true
        task: freq
        imaginary_cutoff_cm1: -50.0
        require_exactly_one: true
        soft_mode_window_cm1: [-50.0, -10.0]
        soft_mode_review:
          enabled: true
          perturbation_scale_bohr: 0.1
          projection_threshold: 0.3
          max_perturbation_attempts: 2
    single_point:
      engine: orca
      task: sp
      method: wB97M-V
      basis: def2-TZVPP
      aux_basis: def2/J
      solvent: acetone
      solvent_model: CPCM
      timeout: 864000

# ===========================================================================
# Phase 1 (Unified Refinement Engine v1.2) — additive section
# The `refinement.*` block is consumed by RefinementEngine (new code path).
# The legacy `theory.s3_low_level` and `theory.s4_high_precision` sections
# above remain in use by LowLevelEngine / HighLevelEngine until Phase 3.
# ===========================================================================
refinement:
  engine_schema: refinement_engine_v1

  common:
    workflow:
      warmup:
        enabled_roles:
          - intermediate
          - ts
        constraint_mode: freeze_forming_bonds_at_input_distance
        fallback_to_input_geometry: true
        accept_partial_geometry: true

      initial_hessian:
        precursor: model
        product: model
        intermediate: calculate
        ts: calculate

      frequency_always_independent: true
      # Fail-fast intent: stop the batch on the first failed structure.  The
      # engine records per-structure isolation; the batch script enforces this.
      continue_on_structure_failure: false

    rescue:
      # The monitor records suspected oscillation for diagnostics only.  ORCA
      # reaches the native 30-cycle checkpoint; Python never terminates it.
      live_monitor:
        enabled: false
        poll_seconds: 20
        min_cycles: 12
        window_cycles: 16
        min_energy_reversals: 4
        energy_change_floor_hartree: 1.0e-5
        min_gradient_improvement_fraction: 0.15
        step_tolerance_ratio: 4.0
        min_excessive_steps: 6

      # Failed minima use the sole every-step-Hessian fallback. Failed TS jobs
      # use R1 NEB candidate -> R2 native OptTS -> R3 mode-directed CalcAll.
      r1_calcall:
        enabled: false
        max_cycles_minimum: 80
        max_cycles_ts: 80

      # Failed-minimum TightOpt rescue (precursor/product with imaginary modes).
      minimum_rescue:
        enabled: false

      # A failed R0 TS uses validated INT/product endpoints. A converged
      # NEB-CI is only a seed; R2 always validates it with an ordinary OptTS.
      neb_ts:
        enabled: false
        variant: LOOSE-NEB-TS
        max_cycles: 250
        minimum_endpoint_rmsd_angstrom: 0.10

      # S3 fail-fast mode (2026-08): every rescue/recovery ladder is disabled
      # so a primary-pass failure is recorded as-is and the batch stops for
      # investigation.  Re-enable per family once the fail-fast batch passes.
      ts_rescue:
        enabled: false
      ts_nonconvergence_rescue:
        enabled: false
      int_rescue:
        enabled: false
      int_nonconvergence_rescue:
        enabled: false

      # S3 rescue matrix (v3.1, 2026-08).  Matrix cells live in code
      # (rescue_matrix.py); these keys tune the method-level ORCA parameters.
      # matrix.enabled=false => primary-only mode (S2-seed robustness tests):
      # failures are classified F1-F6 and recorded, but no rescue methods run.
      # Now re-enabled for the targeted rescue pass on the 4 failed TS.
      matrix:
        enabled: true
      methods:
        fresh_hessian_restart:
          max_cycles: 30
          recalc_hessian: 5
        fresh_hessian_mode_monitor:
          max_cycles: 30
          recalc_hessian: 5
        ts_mode_directed:
          trust: 0.15
          max_cycles: 12
          mode_min_overlap: 0.35
          mode_min_overlap_margin: 0.08
        mode_displacement:
          max_cycles: 30
          displacement_step_angstrom: 0.30
        saddle_break:
          max_cycles: 30
          displacement_step_angstrom: 0.30
        calcall_opt:
          max_cycles: 30
          recalc_hessian: 1
        irc_midpoint_recovery:
          max_cycles: 30
          irc_max_iter: 5
          irc_direction: both
          shoulder_energy_window_kcal_mol: 2.0

    irc:
      enabled: true
      direction: both
      max_iter: 30
      init_hessian: read
      init_displacement_mode: energy
      initial_delta_energy_mEh: 2.0
      scale_initial_displacement: 0.1
      scale_steepest_descent: 0.15
      adaptive_step: true

    identity:
      use_topology: true
      use_mapped_rmsd: true
      use_reaction_progress: true
      validate_all_roles: true

      # INT identity v2 (2026-08): evidence-based intermediate classification.
      # classify_int_v2 replaces the legacy progress-window fallback that could
      # silently default to "distinct_intermediate" when reference geometries
      # were unavailable.  All thresholds live here, never in stage code.
      # Empirical calibration: 40 INT structures across the s2_gfn2 benchmark
      # (dipolar intermediates sit 0-2 kcal/mol below their sibling TS with
      # open forming bonds; product collapses have both bonds <= 1.75 A and
      # RMSD-to-product <= 0.30 A; rx11/12 minor-rescue INTs are 0.13 kcal/mol
      # above their TS at RMSD 0.38 A -> merged_with_ts).
      int_identity_v2:
        classification_version: "int_identity_v2"
        imaginary_cutoff_cm1: -10.0
        product_rmsd_collapse_ang: 0.30
        formed_bond_max_ang: 1.75
        dipolar_open_bond_min_ang: 2.40
        dipolar_open_bond_max_ang: 4.60
        ts_rmsd_merged_ang: 0.40
        ts_energy_merged_kcal: 0.5
        ts_energy_degenerate_kcal: 0.3
        int_below_ts_min_kcal: 0.2
        int_above_product_min_kcal: 2.0
        above_ts_invalid_kcal: 0.5
        product_like_energy_max_kcal: 2.0

    soft_mode:
      enabled: false
      imaginary_cutoff_cm1: -50.0
      soft_mode_window_cm1: [-50.0, -10.0]
      mode_alignment_threshold: 0.30

    thermochemistry:
      temperature_K: 247.55
      standard_state: "1M"
      qrrho: true
      ensemble_correction_source: s1
      composite_formula: "E_SP + (G_freq - E_freq) + ΔG_ensemble"

    ml_quality:
      granular: true
      geometry_consistent_check: true

    output:
      manifest_schema: refinement_manifest_v1

  s3:
    fidelity: low
    profile_id: b97_3c_r2scan_3c_v1

    warmup:
      max_cycles:
        intermediate: 40
        ts: 50

    geometry:
      method: B97-3c
      basis: ""
      route_minimum: Opt
      route_ts: OptTS
      # Kept in sync with theory.s3_low_level.optimization during the
      # refinement-profile dual-read transition. Global 60-cycle cap.
      ts_trust_radius: 0.15
      max_cycles_minimum: 60
      max_cycles_intermediate: 60
      max_cycles_ts: 60
      timeout: 864000

    frequency:
      method: B97-3c
      basis: ""

    single_point:
      method: r2SCAN-3c
      basis: ""
      # Mirrors theory.s3_low_level.single_point: meta-GGA needs DefGrid3.
      grid: DefGrid3
      timeout: 864000

    solvent:
      solvent: acetone
      solvent_model: CPCM

    resources:
      cores_per_worker: 16
      memory_gb_per_worker: 32
      max_workers: 1

  s4:
    fidelity: high
    profile_id: m062x_wb97mv_v1

    warmup:
      max_cycles:
        intermediate: 4
        ts: 6

    geometry:
      method: M062X
      basis: def2-SVP
      aux_basis: def2/J
      grid: DefGrid3
      scf: TightSCF
      route_minimum: Opt
      route_ts: OptTS
      max_cycles_minimum: 200
      max_cycles_ts: 200
      timeout: 864000

    frequency:
      method: M062X
      basis: def2-SVP

    single_point:
      method: wB97M-V
      basis: def2-TZVPP
      aux_basis: def2/J
      timeout: 864000

    solvent:
      solvent: acetone
      solvent_model: CPCM

    resources:
      cores_per_worker: 32
      memory_gb_per_worker: 64
      max_workers: 1

step1:
  protocol: censo_lite
  allowed_protocols:
    - censo_lite
  censo_lite:
    crest:
      engine: crest
      gfn_level: 2
      # auto uses the global S1 core budget; explicit values are clamped to it.
      nproc: auto
      search_mode: imtd_gc
      energy_window_kcal: 6.0
      solvent: acetone
      additional_flags: ""
      timeout: 21600
    ranking:
      engine: orca
      task: sp
      method: B97-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      timeout: 864000
    prefilter:
      # CREST already applies its 6 kcal/mol ensemble window. Null values keep
      # that complete unique ensemble for the S1 partition function.
      xtb_window_kcal: null
      max_candidates_soft: null
      extra_deduplication: true
      preserve_torsion_clusters: true
      min_per_cluster: 1
    b97_3c:
      failure_policy: strict
      parallel_jobs: 16
      cores_per_job: 1
      max_parallel_jobs: 16
      scheduling:
        policy: throughput_first
        memory:
          job_overhead_mb: 256
          min_maxcore_mb_per_rank: 1000
          maxcore_cap_mb_per_rank: 4000
        # Enabled layouts must come from a fixed-ensemble benchmark. With no
        # exact profile entry every conformer remains a one-core throughput job.
        final_wave:
          enabled: false
          max_cores_per_job: 4
          profile_layouts: {}
    xtb_thermo:
      enabled: true
      # strict aborts S1 on any missing correction. defer preserves the full
      # B97 ensemble for S2 geometry handoff but emits no Zrel/population/Gconf.
      failure_policy: defer
      gfn_level: 2
      parallel_jobs: auto
      cores_per_job: 1
      max_parallel_jobs: 16
      scheduling:
        policy: throughput_first
        final_wave:
          enabled: false
          max_cores_per_job: 4
          profile_layouts: {}
      retry_nproc: 1
      scc_retry_max_iterations: 1000
      bhess_level: normal
      omp_stacksize: 1G
      omp_max_active_levels: 1
      fallback_enabled: false
      fallback_gfn_level: 0
      fallback_nproc: 1
      sthr: 50.0
      imagthr: -100.0
      temperature_k: 298.15
      ledger_tolerance_hartree: 1.0e-7
      timeout: 864000
    deduplication:
      backend: torsion_signature
      heavy_atom_rmsd_prefilter_A: 0.25
      torsion_bin_deg: 20.0
      torsion_rmsd_deg: 25.0
      preserve_stereochemistry: true
      preserve_mirror_pairs: true
    selection:
      final_window_kcal: 2.5
      min_keep: 3
      max_keep: 10
    retention:
      energy_window_kcal: 6.0
      always_keep_lowest: true

step2:
  # Canonical S2 workflow: ORCA GFN2-xTB relaxed scan, full-frame B97-3c
  # single-point refinement, then the unified endpoint/knee/seed selector.
  # B97-3c relaxed scan is used only when the GFN2 trajectory is topologically
  # distorted or its first-round SP refinement is incomplete.
  method: "orca_gfn2_relaxed_scan"

  scan:
    topology_guard_enabled: true
    scan_start_distance: 3.4
    scan_end_distance: 1.2
    scan_steps: auto
    coarse_step_A: 0.20
    scan_policy: policy_c
    scan_force_constant: 0.05
    terminate_after_consecutive_off_path: 2
    reclassify_isolated_topology_suspects: true
    isolated_topology_max_energy_jump_kcal: 5.0
    isolated_topology_max_reaction_core_rmsd_A: 0.15
    anchor_detection:
      persistent_drift_points: 2
      plateau_onset:
        slope_ratio_to_ts: 0.25
        slope_change_ratio_to_ts: 0.15
        absolute_slope_ceiling_kcal_mol_A: 12.0
        minimum_consecutive_intervals: 2
        allow_segmented_regression_fallback: true
    endpoint_extension:
      enabled: true
      increment_A: 0.25
      maximum_coordinate_A: 4.20
      min_dissociation_side_span_A: 0.50
      min_valid_post_ts_points: 5
      max_extensions: 3
    selection:
      preferred_energy_source: b973c
      # Both direct selection and rescue use this same geometric rule.
      ts_min_prominence_kcal_mol: 0.40
      # A topology-clean valid-corridor can still carry a chemically useful,
      # shallow B97-3c maximum.  It must beat both this local threshold and
      # the reactant-to-peak barrier below before it outranks a full PATH.
      valid_corridor_weak_peak_min_prominence_kcal_mol: 0.10
      valid_corridor_weak_peak_min_barrier_kcal_mol: 3.0
      # Diagnostic only.  S2 produces search seeds rather than validated
      # stationary points, so this value is not a hard seed-admission gate.
      ts_min_reactant_barrier_kcal_mol: 3.0
      # Compared after excluding atoms in S0 forming_bonds. This rejects PATH
      # artefacts while allowing the intended reaction core to move.
      max_nonreactive_scaffold_rmsd_A: 0.75
      # Rescue topology defects only when the curve has no supported knee
      # before the first defect, or fewer than this many clean frames remain
      # between the knee and that defect.
      minimum_clean_frames_after_knee: 2
      # Keep false for pathways that may be concerted. Mechanism templates may
      # enable this when a stepwise INT is chemically mandatory.
      require_intermediate: false
      # A full-endpoint peak immediately after topology recovery is a boundary
      # artefact until this many clean frames precede it.
      full_endpoint_min_clean_frames_from_boundary: 3
      # Require clean PATH support on both sides of an eligible peak.  This
      # prevents the topology-recovery boundary from being mistaken for a TS.
      ts_min_clean_neighbors: 3
      # Keep the energy peak as the TS locator, but seed S3 from the nearest
      # clean pre-peak PATH frame 0.20 A toward the reactant side.  PATH order
      # is authoritative; the mean forming-bond distance is only a tie-breaker.
      ts_seed_reactant_backoff_A: 0.20
      int_min_basin_prominence_kcal_mol: 0.50
      # A flat pre-TS region is a valid MIN-search seed even when it is not a
      # resolved stationary basin.  It is preferred to duplicating the TS.
      int_plateau_fallback_enabled: true
      int_plateau_min_consecutive_frames: 3
      int_plateau_min_ts_separation_A: 0.10
      int_plateau_energy_window_kcal_mol: 2.0
      int_plateau_barrier_fraction: 0.25
      # PATH arc length is short, so a shallow pre-TS rise can have a large
      # numerical dE/ds.  The energy window and continuity criteria are the
      # primary plateau filters; retain ramps up to this value.
      int_plateau_max_slope_kcal_mol_A: 40.0
      # These keys feed the one global selector used by both the direct scan
      # and conditional B97-3c rescue.
      endpoint_exclusion_frames: 2   # legacy endpoint buffer retained for compatibility
      min_reaction_progress: 0.10    # only discard the first pathological boundary region
      min_valid_neighbor_window: 1   # topology-valid neighbors required on each side of a TS candidate
      allow_monotonic_shoulder: true # legacy diagnostic compatibility; knee selection is authoritative
      shoulder_max_abs_slope_kcal_mol_per_A: 20.0  # legacy diagnostic compatibility
      shoulder_min_curvature_signal: 0.05          # legacy fallback for knee curvature
      allow_shared_search_seed: true # final fallback only when no TS-to-endpoint INT frame exists
      endpoint:
        guard_frames: 1
        min_valid_frames: 3
      knee:
        enabled: true
        smoothing_window: 5
        minimum_left_support_frames: 2
        minimum_right_support_frames: 2
        minimum_curvature_signal: 0.05
        minimum_slope_change_kcal_mol_per_A: 0.0
      ts_seed:
        right_shift:
          enabled: true
          base_A: 0.15
          span_fraction: 0.10
          min_A: 0.05
          max_A: 0.40
          override_A: null  # optional S3-calibrated value; null uses span-adaptive value
      int_seed:
        mode: ts_to_effective_endpoint_midpoint
      int_plateau:
        min_consecutive_frames: 3
        energy_window_kcal_mol: 2.0
        min_ts_separation_A: 0.10
        max_slope_kcal_mol_A: 40.0
      admission:
        require_barrier_for_search_seed: false
        require_scaffold_for_search_seed: false

  # The primary scan deliberately uses the same coordinate range and point
  # count as the former B97-3c rescue, but runs through ORCA's GFN2-xTB method.
  orca_gfn2_scan:
    enabled: true
    relaxed_scan:
      stretch_end_A: 3.40
      points: 17
      single_coordinate_use_scants: true
      # ORCA GFN2-xTB does not accept CPCM/SMD.  Keep the S2
      # semiempirical scan solvent-specific; S3/S4 retain CPCM.
      solvent: acetone
      solvent_model: ALPB
      # GFN2-xTB SCF shows no OpenMP scaling on these small systems, so a
      # 4-thread scan is lossless and lets parallel reactions share the node.
      # maxcore is capped explicitly: the per-core default would balloon to
      # ~5.3 GB/core at nproc=4 and oversubscribe memory with 4+ reactions.
      nproc: 4
      maxcore: 1600

  # Conditional high-level rescue. It is entered only after the GFN2 scan has
  # incomplete frame/SP coverage or a topology distortion that occurs before
  # a supported knee with enough clean post-knee frames.
  rescue:
    # GFN2-only robustness mode: topology drift is tolerated (knee-shifted
    # seeds over clean frames) instead of falling back to a B97-3c relaxed
    # scan.  Set enabled: true to restore the conditional high-level rescue.
    enabled: false
    # It is never a retry route for an S3 failure.
    relaxed_scan:
      # ORCA method, solvent, resources, MaxIter and timeout are inherited
      # from theory.s3_low_level.optimization and resources.  Keep this block
      # limited to S2 reaction-coordinate and candidate-selection policy.
      stretch_end_A: 3.40
      points: 17
      single_coordinate_use_scants: true
      # Same 4-core budget as the primary GFN2 scan so a rescue can run
      # concurrently with the other reactions instead of oversubscribing
      # the node at the inherited 16-core default.
      nproc: 4
      maxcore: 1600
      # The shared scan.selection block above is authoritative for seed choice.
      ts_min_prominence_kcal_mol: 0.40
      ts_min_reactant_barrier_kcal_mol: 3.0
      max_nonreactive_rmsd_A: 0.75

  scan_charge_spin:
    charge: 0
    multiplicity: 1
  energy_refinement:
    # B97-3c SP refinement now runs on every PATH frame (full coverage).
    enabled: true
    engine: orca
    task: sp
    method: B97-3c
    basis: ""
    aux_basis: ""
    solvent: acetone
    solvent_model: CPCM
    route_extras: ""
    # 4-way SP parallelism per reaction: with 4 reactions sharing a 32-core
    # node, the refinement budget matches the scan budget (4 cores/task).
    parallel_jobs: 4
    cores_per_job: 1
    memory_per_job: 2GB
    timeout: 864000

step3:
  enabled: true
  continue_on_structure_failure: true
  scheduling:
    enabled: true
    # Serial execution: one ORCA job at a time, using the full machine.
    # Parallel mode (max_workers=2, nproc=8, mem=16GB) saturated the host
    # at 100% with zero headroom and caused intermittent ORCA failures.
    max_workers: 1
    nproc_per_job: 16
    memory_per_job: 32GB
    priority_roles:
      - ts
      - intermediate
      - precursor
      - product
    max_concurrent_by_role:
      ts: 1
      intermediate: 1
      precursor: 2
      product: 2

step4:
  enabled: true
  continue_on_structure_failure: true
  scheduling:
    enabled: true
    # Serial execution: same rationale as step3 — avoid ORCA failures under
    # 100% host saturation. S4 (M062X/wB97M-V) is even heavier than S3, so
    # per-job resource pressure is higher.
    max_workers: 1
    nproc_per_job: 16
    memory_per_job: 32GB
    priority_roles:
      - ts
      - intermediate
      - precursor
      - product
    max_concurrent_by_role:
      ts: 1
      intermediate: 1
      precursor: 2
      product: 2

ui:
  # auto selects the embedded Live dashboard on a capable TTY and classic
  # single-line output for redirected/no-colour runs.
  mode: auto
  heartbeat_seconds: 30
  non_tty_heartbeat_seconds: 60
  progress_snapshots: 20
  active_job_limit: 8
  completed_job_tail: 5
  top_population_count: 5
  show_output_paths: true
  stalled_job_warning_seconds: 720
  recovery:
    enabled: true
    # PID/heartbeat older than this is considered stale during resume-time
    # stale-running recovery.
    stale_heartbeat_seconds: 300
    # When a structure PID is dead and its outputs are incomplete, mark the
    # stage interrupted and let the normal stage rerun path re-queue the work.
    requeue_interrupted_structures: true
  recent_alert_limit: 50
  dashboard:
    refresh_per_second: 4
    min_width: 80
    wide_width: 120
    max_active_jobs: 6
    recent_alerts: 3
    recent_decisions: 3
    retain_final_summary: true

run:
  resume: true
  # Refuse silent upstream recomputation when a completed checkpoint no longer
  # matches the active scientific configuration.
  resume_policy: strict
  checkpoint:
    enabled: true
  output_root: ./Output

# ORCA failure classification
orca_failure_classification:
  enabled: true
  # Maximum characters of ORCA output to scan for failure patterns.
  scan_tail_chars: 50000
  # Lines of context to retain around each evidence match.
  evidence_context_lines: 1
