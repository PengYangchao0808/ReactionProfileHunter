# ReactionProfileHunter V4.0 canonical configuration
# Only S0-S4 settings are allowed here. Legacy V3 protocol branches are removed.

schema_version: rph_v4_config_v1

executables:
  gaussian:
    path: /opt/software/gaussian/g16/g16
    root: /opt/software/gaussian/g16
    scratch_dir: /tmp/g16scratch
    use_wrapper: false
    wrapper_path: ""
  orca:
    path: /opt/software/orca/orca
    ld_library_path: /opt/software/orca
    mpi_bin_dir: /opt/openmpi418/bin
    mpi_lib_dir: /opt/openmpi418/lib
  crest:
    path: /opt/software/crest/crest
  xtb:
    path: /opt/software/xtb/bin/xtb
    fallback_paths:
      - /opt/xtb/bin/xtb
      - /usr/local/bin/xtb
  discovery:
    enabled: true
    fail_on_invalid_explicit: true

resources:
  mem: 32GB
  nproc: 16
  orca_maxcore_safety: 0.65

thermo:
  temperature_k: 298.15
  pressure_atm: 1.0

theory:
  s3_low_level:
    optimization:
      engine: orca
      task: opt
      method: B97-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      solvent_model: CPCM
      route_minimum: "Opt"
      route_ts: "OptTS"
      route_extras: ""
      max_cycles: 100
      timeout: 864000
      frequency:
        enabled_for_ts: true
        task: freq
        imaginary_cutoff_cm1: -50.0
        require_exactly_one: true
    single_point:
      engine: orca
      task: sp
      method: r2SCAN-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      solvent_model: CPCM
      timeout: 864000

  s4_high_precision:
    optimization:
      engine: gaussian
      task: opt
      method: M062X
      basis: def2-SVP
      solvent: acetone
      solvent_model: CPCM
      route_minimum: "Opt"
      route_ts: "Opt=(TS,CalcFC,NoEigenTest)"
      grid: UltraFine
      scf: XQC
      max_cycles: 200
      timeout: 864000
      frequency:
        enabled_for_ts: true
        task: freq
        imaginary_cutoff_cm1: -50.0
        require_exactly_one: true
    single_point:
      engine: orca
      task: sp
      method: wB97M-V
      basis: def2-TZVPP
      aux_basis: def2/J
      solvent: acetone
      solvent_model: CPCM
      timeout: 864000

step1:
  protocol: censo_lite
  allowed_protocols:
    - censo_lite
  censo_lite:
    crest:
      engine: crest
      gfn_level: 2
      search_mode: imtd_gc
      energy_window_kcal: 6.0
      solvent: acetone
      additional_flags: ""
      timeout: 21600
    ranking:
      engine: orca
      task: sp
      method: B97-3c
      basis: ""
      aux_basis: ""
      solvent: acetone
      timeout: 864000
    prefilter:
      xtb_window_kcal: 5.0
      max_candidates_soft: 60
      extra_deduplication: true
      preserve_torsion_clusters: true
      min_per_cluster: 1
    b97_3c:
      energy_window_kcal: 4.0
      parallel_jobs: 1
      cores_per_job: 16
    xtb_thermo:
      enabled: true
      thermo_pool_max: 30
      failure_policy: ensemble_electronic_only
      gfn_level: 1
      nproc: 4
      bhess_level: normal
      omp_stacksize: null
      omp_max_active_levels: 1
      fallback_enabled: true
      fallback_gfn_level: 0
      fallback_nproc: 1
      sthr: 50.0
      imagthr: -100.0
      temperature_k: 298.15
      timeout: 864000
    deduplication:
      backend: torsion_signature
      heavy_atom_rmsd_prefilter_A: 0.25
      torsion_bin_deg: 20.0
      torsion_rmsd_deg: 25.0
      preserve_stereochemistry: true
      preserve_mirror_pairs: true
    selection:
      final_window_kcal: 2.5
      min_keep: 3
      max_keep: 10
    retention:
      energy_window_kcal: 6.0
      always_keep_lowest: true

step2:
  scan:
    topology_guard_enabled: true
    scan_start_distance: 4.0
    scan_end_distance: 1.5
    scan_steps: 24
    retry_on_boundary_maximum: true
    retry_factor: 1.15
  xtb_settings:
    charge: 0
    multiplicity: 1
    solvent: acetone
    nproc: null

step3:
  enabled: true
  continue_on_structure_failure: true

step4:
  enabled: true
  continue_on_structure_failure: true

run:
  resume: true
  checkpoint:
    enabled: true
  output_root: ./Output
